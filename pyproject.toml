[project]
name = "x2loc"
version = "0.1.0"
description = "XCOM 2 War of the Chosen localization toolkit — parse, align, translate, and round-trip UE3 .int/.chn files through Weblate."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ITOTI-Y" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "httpx2[http2]>=2.5.0",
    "langchain>=1.3.13",
    "langchain-anthropic>=1.4.1",
    "langchain-core>=1.3.0",
    "langchain-openai>=1.1.14",
    "langgraph>=1.1.8",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.10.0",
    "questionary>=2.1.1",
    "rapidfuzz>=3.14.5",
    "rich>=15.0.0",
    "sse-starlette>=3.4.0",
    "typer>=0.24.1",
    "unidecode>=1.4.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "grandalf>=0.8",
    "joblib>=1.5.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.9",
    "ty>=0.0.29",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "N"]
# RUF001/RUF002/RUF003: Chinese full-width punctuation is legitimate in
# this localization project (source/target strings, docstrings).
ignore = ["E501", "N805", "N806", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
x2loc = "src.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
